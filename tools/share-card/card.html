<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,700&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{font-family:'DM Sans',sans-serif;background:#06303F;color:#fff;display:grid;grid-template-columns:690px 510px}
  .text{padding:64px 0 56px 72px;display:flex;flex-direction:column}
  .brand{display:flex;align-items:center;gap:18px}
  .brand img{width:84px;height:84px}
  .brand b{font-size:34px;display:block;line-height:1.1}
  .brand span{font-size:20px;color:#CFE0E7}
  h1{font-size:76px;line-height:1.02;letter-spacing:-2px;margin:auto 0 0;font-weight:700}
  h1 em{font-style:normal;color:#FDD32A}
  p{font-size:24px;color:#DCE8ED;margin:22px 0 0;line-height:1.35;max-width:560px}
  .photo{position:relative;background:url(../../assets/media/regionals-back-1400.jpg) 50% 38%/cover}
  .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#06303F 0,rgba(6,48,63,0) 22%)}
  .bar{position:absolute;left:0;right:0;bottom:0;height:14px;background:#FDD32A}
</style></head>
<body>
  <div class="text">
    <div class="brand"><img src="../../assets/leander-crest.png" alt=""><div><b>Leander Swimming Club</b><span>South London · since 1949</span></div></div>
    <h1>Swim your best, <em>among friends</em></h1>
    <p>Learn to swim, train and race, or swim for life. Website prototype for feedback.</p>
  </div>
  <div class="photo"></div>
  <div class="bar"></div>
</body></html>
